services:
  catalogdb:
    image: postgres
    
  basketdb:
    image: postgres
    
  distributedcache:
    image: redis
    
  orderdb: 
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Asd12345678
    restart: always
    ports:
      - "1433:1433"
  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    depends_on:
      - catalogdb

  basket.api:
    image: basket.api
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    depends_on: 
      - basketdb
      - distributedcache
      - discount.grpc
    
#  front:
#    image: front
#    build:
#      context: /home/seif/Downloads/ecommerce-dashboard
#      dockerfile: /home/seif/Downloads/ecommerce-dashboard/Dockerfile
#    ports:
#      - "7002:80"
      
  discount.grpc:
    image: discount.grpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket: 


